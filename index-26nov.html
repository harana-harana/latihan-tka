:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Lexend,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:18px max(5vw,16px)}
.top .in{max-width:980px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;font-weight:600;flex:1}
.home{background:transparent;border:1.5px solid #ffffff88;color:#fff;border-radius:10px;padding:8px 14px;min-height:44px}
main{max-width:980px;margin:auto;padding:24px max(4vw,14px) 60px}
.hero{background:var(--blue);color:#fff;border-radius:22px;padding:clamp(24px,4vw,44px);position:relative;overflow:hidden}
.hero h2{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 10px;text-wrap:balance;max-width:16ch}
.hero p{margin:0;max-width:58ch;color:#dce9f7}
.hero svg{position:absolute;right:-20px;bottom:-30px;width:min(300px,45%);opacity:.95}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;text-align:left;color:var(--ink);display:grid;gap:8px;transition:transform .15s}
.mcard:hover{transform:translateY(-3px);border-color:var(--blue2)}
.mcard b{font-size:24px;line-height:1.15}
.mcard .ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#13233a;background:var(--yel)}
.mcard small{color:var(--mute)}
.mcard .go{margin-top:6px;font-weight:600;color:var(--blue2)}
.mcard .last{font-size:14px;color:var(--ok)}
.note{margin-top:22px;color:var(--mute);font-size:14px;max-width:70ch}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar .t{font-weight:600;flex:1}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--yel);transition:width .2s}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px)}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.no{background:var(--blue);color:#fff;border-radius:10px;padding:2px 12px;font-weight:600}
.tag{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute)}
.ctx p{margin:0 0 10px}
.ctx img,.opt img,.row img{max-width:100%;height:auto;border-radius:8px;display:block;background:#fff}
.ctx img{margin:10px 0 14px;max-height:560px;width:auto}
.passage{background:light-dark(#f7f9fc,#0f1c30);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;max-height:460px;overflow:auto}
.passage h4{margin:0 0 8px;font-size:18px}
.passage p{margin:0 0 9px}
.passage img{max-width:100%;height:auto;max-height:380px;border-radius:8px;margin:6px 0 12px;display:block}
.passage .dlg p{margin:0 0 5px}
.passage .src{font-size:13px;color:var(--mute)}
.q{font-weight:600;margin:14px 0 4px}
.hint{font-size:14px;color:var(--blue2);margin-bottom:10px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-size:14px;font-weight:600}
.opt.sq .k{border-radius:7px}
.opt.on{background:var(--sel);border-color:var(--blue2)}
.opt.on .k{background:var(--blue2);border-color:var(--blue2);color:#fff}
.opt img{max-height:230px;width:auto}

table.tb{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}table.tb th,table.tb td{border:1px solid #d8d4cc;padding:6px 8px;text-align:left;vertical-align:middle}table.tb th{background:#f3f0ea}.ctx table.tb img{display:block}
.kat th,.kat td{border:1px solid var(--line);padding:10px;vertical-align:middle}
.kat th{background:var(--sel);font-size:14px;text-align:left}
.kat th.c,.kat td.c{text-align:center;width:92px}
.kat .row img{max-height:190px;width:auto}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--mute);background:transparent}
.dot.on{background:var(--blue2);border-color:var(--blue2);box-shadow:inset 0 0 0 5px var(--card)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:46px;font-weight:600;background:var(--line);color:var(--ink)}
.btn.p{background:var(--blue);color:#fff}
.btn.y{background:var(--yel);color:#13233a}
.timer{font-weight:700;background:var(--blue);color:#fff;border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums}.timer.low{background:var(--no)}
.grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.grid button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.grid button.done{background:var(--blue2);border-color:var(--blue2);color:#fff}
.grid button.cur{outline:3px solid var(--yel);outline-offset:1px}

.grid button.r0{background:var(--no);border-color:var(--no);color:#fff}
.grid button.rh{background:var(--yel);border-color:var(--yel);color:#13233a}

.modal.show{display:grid}
.modal .box{background:var(--card);border-radius:18px;padding:24px;max-width:420px}
.modal h3{margin:0 0 8px}
.score{background:var(--blue);color:#fff;border-radius:20px;padding:clamp(20px,4vw,36px);display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.ring{width:150px;height:150px}
.score h2{margin:0 0 6px;font-size:clamp(26px,4vw,36px);line-height:1.1}
.score p{margin:0 0 4px;color:#dce9f7}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stats span{background:#ffffff1f;border-radius:10px;padding:6px 12px;font-size:14px}
.rv{margin-top:18px}
.rv .qcard{margin-bottom:16px}
.res{display:inline-block;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600}
.res.r1{background:var(--okbg);color:var(--ok)}.res.r0{background:var(--nobg);color:var(--no)}.res.rh{background:light-dark(#fff4d0,#3a3010);color:light-dark(#7a5a00,#ffd86b)}

.opt.bad{border-color:var(--no);background:var(--nobg)}
.opt .mark{margin-left:auto;font-weight:600;font-size:14px;white-space:nowrap}
td.key{background:var(--okbg)}td.bad{background:var(--nobg)}

.subjrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.subjrow .sc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.subjrow small{color:var(--mute)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

.btn.sm{min-height:42px;padding:8px 14px;font-size:14px}
.chart{width:100%;height:auto;display:block}.ctitle{font-weight:600;margin:6px 0}
.tw{overflow-x:auto}.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.hist td:nth-child(3){white-space:normal;min-width:180px}
.hist th{color:var(--mute);font-weight:500}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:20px;margin-bottom:14px}.empty p{color:var(--mute);margin:4px 0 12px}
@media(max-width:760px){.auth{grid-template-columns:1fr}.top nav{width:100%}.top nav #who{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const MEM={};
const LS={get(k){try{const v=localStorage.getItem(k);return v==null?(k in MEM?MEM[k]:null):JSON.parse(v)}catch(e){return k in MEM?MEM[k]:null}},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}};
const API_URL=String(window.TKA_API_URL||'').trim();
const REMOTE=!!API_URL;
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
const rid=()=>Array.from(crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(16)):[...Array(16)].map(()=>Math.random()*256|0),x=>x.toString(16).padStart(2,'0')).join('');
const okUser=u=>/^[a-z0-9_.]{3,30}$/.test(u);
const Local={
  async register(d){const users=LS.get('tka-users')||{};const u=String(d.username||'').toLowerCase().trim();
    if(!okUser(u))return{ok:false,msg:'Nama pengguna 3–30 karakter: huruf kecil, angka, titik, atau garis bawah.'};
    if(users[u])return{ok:false,msg:'Nama pengguna sudah dipakai.'};
    const salt=rid();users[u]={nama:d.nama,kelas:d.kelas||'',sekolah:d.sekolah||'',salt,hash:await sha(salt+d.password),dibuat:Date.now(),peran:u==='admin'?'admin':'siswa'};LS.set('tka-users',users);
    return Local.login(d)},
  async login(d){const users=LS.get('tka-users')||{};const u=String(d.username||'').toLowerCase().trim(),x=users[u];
    if(!x||x.hash!==await sha(x.salt+d.password))return{ok:false,msg:'Nama pengguna atau kata sandi salah.'};
    const token=rid();const s=LS.get('tka-sessions')||{};s[token]=u;LS.set('tka-sessions',s);
    return{ok:true,token,user:{username:u,nama:x.nama,kelas:x.kelas,sekolah:x.sekolah,peran:x.peran||'siswa'}}},
  async me(d){const u=(LS.get('tka-sessions')||{})[d.token];const x=u&&(LS.get('tka-users')||{})[u];return x?{ok:true,user:{username:u,nama:x.nama,kelas:x.kelas,sekolah:x.sekolah,peran:x.peran||'siswa'}}:{ok:false}},
  async logout(d){const s=LS.get('tka-sessions')||{};delete s[d.token];LS.set('tka-sessions',s);return{ok:true}},
  async saveResult(d){const u=(LS.get('tka-sessions')||{})[d.token];if(!u)return{ok:false,msg:'Sesi habis'};const k='tka-res-'+u,a=LS.get(k)||[];a.push(d.result);LS.set(k,a);return{ok:true}},
  async adminData(d){const u=(LS.get('tka-sessions')||{})[d.token],users=LS.get('tka-users')||{};if(!u||users[u].peran!=='admin')return{ok:false,msg:'Akun ini bukan admin.'};
    const list=Object.entries(users).map(([k,x])=>({username:k,nama:x.nama,kelas:x.kelas,sekolah:x.sekolah,peran:x.peran||'siswa',dibuat:x.dibuat}));
    return{ok:true,users:list,results:list.flatMap(x=>(LS.get('tka-res-'+x.username)||[]).map(r=>Object.assign({username:x.username},r)))}},
  async results(d){const u=(LS.get('tka-sessions')||{})[d.token];if(!u)return{ok:false,msg:'Sesi habis'};return{ok:true,results:LS.get('tka-res-'+u)||[]}}
};
async function call(action,data){
  if(!REMOTE)return Local[action](data||{});
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action},data||{}))});
  return r.json();
}
let SESS=null,RES=[];
async function flushPending(){const p=LS.get('tka-pending-'+SESS.user.username)||[];if(!p.length)return;const left=[];
  for(const r of p){try{const x=await call('saveResult',{token:SESS.token,result:r});if(!x.ok)left.push(r)}catch(e){left.push(r)}}
  LS.set('tka-pending-'+SESS.user.username,left)}
async function loadResults(){try{const x=await call('results',{token:SESS.token});if(x.ok)RES=x.results||[]}catch(e){}
  const p=LS.get('tka-pending-'+SESS.user.username)||[];const seen=new Set(RES.map(r=>r.id));p.forEach(r=>{if(!seen.has(r.id))RES.push(r)});RES.sort((a,b)=>a.ts-b.ts)}
async function saveResult(r){RES.push(r);let ok=false;try{const x=await call('saveResult',{token:SESS.token,result:r});ok=x.ok}catch(e){}
  if(!ok){const k='tka-pending-'+SESS.user.username,p=LS.get(k)||[];p.push(r);LS.set(k,p)}return ok}

  const reg=mode==='reg';
  app.innerHTML=`<section class="auth"><div class="aside"><h2>${reg?'Buat akun latihan':'Masuk untuk mulai latihan'}</h2><p>Setiap akun punya catatan kemajuan sendiri: skor tiap paket, grafik perkembangan, dan mapel yang perlu dikuatkan.</p>${REMOTE?'':'<p class="mini">Mode uji coba: akun dan hasil tersimpan di perangkat ini saja. Setelah dihubungkan ke Google Apps Script, akun tersimpan di Google Sheets dan bisa dibuka dari perangkat mana pun.</p>'}</div>
  <form class="aform" id="af" autocomplete="on"><div class="tabs"><button type="button" class="${reg?'':'on'}" data-m="in">Masuk</button><button type="button" class="${reg?'on':''}" data-m="reg">Daftar</button></div>
  ${reg?`<label>Nama lengkap<input name="nama" required maxlength="60" autocomplete="name"></label><div class="two"><label>Kelas<input name="kelas" maxlength="10" placeholder="6A"></label><label>Sekolah<input name="sekolah" maxlength="60"></label></div>`:''}
  <label>Nama pengguna<input name="username" required maxlength="30" autocomplete="username" autocapitalize="none" placeholder="contoh: rina.6a"></label>
  <label>Kata sandi<input name="password" type="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}"></label>
  ${reg?'<label>Ulangi kata sandi<input name="password2" type="password" required minlength="6" autocomplete="new-password"></label>':''}
  <p class="err" id="aerr">${msg?esc(msg):''}</p><button class="btn p" type="submit" id="asub">${reg?'Daftar & masuk':'Masuk'}</button></form></section>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authScreen(b.dataset.m));
  document.getElementById('af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const er=document.getElementById('aerr'),sb=document.getElementById('asub');
    f.username=String(f.username||'').toLowerCase().trim();
    if(reg&&f.password!==f.password2){er.textContent='Kata sandi dan ulangannya tidak sama.';return}
    if(reg&&!okUser(f.username)){er.textContent='Nama pengguna 3–30 karakter: huruf kecil, angka, titik, atau garis bawah (tanpa spasi).';return}
    sb.disabled=true;sb.textContent='Memproses…';er.textContent='';
    try{const x=await call(reg?'register':'login',f);if(!x.ok){er.textContent=x.msg||'Gagal.';sb.disabled=false;sb.textContent=reg?'Daftar & masuk':'Masuk';return}
      SESS={token:x.token,user:x.user};LS.set('tka-sess',SESS);await enter()}
    catch(err){er.textContent='Tidak bisa terhubung ke server. Periksa koneksi internet lalu coba lagi.';sb.disabled=false;sb.textContent=reg?'Daftar & masuk':'Masuk'}};
  scrollTo(0,0);
}
async function enter(){app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">Memuat data akun…</p>';

async function boot(){const s=LS.get('tka-sess');if(!s){authScreen('in');return}
  app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">Memeriksa sesi…</p>';
  try{const x=await call('me',{token:s.token});if(x.ok){SESS={token:s.token,user:x.user};await enter();return}}catch(e){SESS=s;await enter();return}
  LS.del('tka-sess');authScreen('in','Sesi berakhir, silakan masuk lagi.')}

function body(q,i,a,review){

function ask(left){

function grade(q,a){
  if(q.t==='pg')return a===q.ans||(q.alt||[]).includes(a)?1:0;
  if(q.t==='mcma'){const ok=a.length===q.ans.length&&q.ans.every(x=>a.includes(x));if(ok)return 1;const hit=a.filter(x=>q.ans.includes(x)).length;return hit?0.5:0}
  const r=q.ans.filter((v,i)=>a[i]===v).length;return r===q.ans.length?1:r?0.5:0;
}
function resTag(q,a){const g=grade(q,a);return g===1?'<span class="res r1">Benar</span>':g?'<span class="res rh">Benar sebagian</span>':'<span class="res r0">'+(answered(q,a)?'Salah':'Tidak dijawab')+'</span>'}
function result(timeout){

  const sc=Math.round(b/n*1000)/10,scs=num(sc);

  app.innerHTML=`<section class="score"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff2a" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="#ffc72c" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="Lexend">${scs}</text><text x="60" y="80" text-anchor="middle" fill="#dce9f7" font-size="12" font-family="Lexend">dari 100</text></svg>

  <div class="nav" style="justify-content:flex-start"><button class="btn y" id="again">Ulangi paket ini</button><button class="btn" id="back" style="background:#ffffff26;color:#fff">Pilih paket lain</button><button class="btn" id="toD" style="background:#ffffff26;color:#fff">Lihat dashboard</button></div></div></section>
  <div class="grid">${qs.map((q,i)=>`<button data-j="${i}" class="${g[i]===1?'r1':g[i]?'rh':'r0'}">${i+1}</button>`).join('')}</div>
  <div class="filter"><button data-f="all">Semua pembahasan</button><button data-f="wrong">Hanya yang belum benar</button></div>

  scrollTo(0,0);
}

function svgChart(o){
  // o:{labels,series:[{name,color,values}],shape,max,unit,title}
  const W=680,H=320,l=44,r=16,t=20,b=58,ink=inkColor(),grid='#8a9bb3';
  const n=o.labels.length,max=o.max||Math.max(1,...o.series.flatMap(s=>s.values.filter(v=>v!=null)))*1.15;
  const X=i=>l+(n<=1?(W-l-r)/2:(W-l-r)*(o.shape==='bar'?(i+.5)/n:i/(n-1))),Y=v=>t+(H-t-b)*(1-v/max);
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||'Grafik')}" font-family="Lexend,system-ui,sans-serif">`;
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="${grid}" stroke-opacity=".25"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${ink}" fill-opacity=".7">${Math.round(v)}</text>`}
  const step=Math.ceil(n/12);

  const S=o.series.length;
  o.series.forEach((s,si)=>{
    if(o.shape==='bar'){const bw=Math.min(46,(W-l-r)/n*.75/S);
      s.values.forEach((v,i)=>{if(v==null)return;const x=X(i)-bw*S/2+bw*si,y=Y(v);g+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${Y(0)-y}" rx="3" fill="${s.color}"><title>${esc(s.name)} · ${esc(o.labels[i])}: ${num(v)}${o.unit||''}</title></rect>`;
        if(n*S<=14)g+=`<text x="${x+(bw-2)/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="600" fill="${ink}">${num(v)}</text>`})}
    else{const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]);let d='',pen=false;pts.forEach(p=>{if(!p)return;d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);pen=true});
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      pts.forEach((p,i)=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}"><title>${esc(s.name)} · ${esc(o.labels[i])}: ${num(s.values[i])}${o.unit||''}</title></circle>`})}
  });
  if(S>1)o.series.forEach((s,si)=>{const x=l+si*150;g+=`<rect x="${x}" y="${H-22}" width="12" height="12" rx="2" fill="${s.color}"/><text x="${x+18}" y="${H-12}" font-size="12" fill="${ink}">${esc(s.name)}</text>`});
  return g+'</svg>';
}
function filtered(){const now=Date.now(),lim=DF.range==='7'?7:DF.range==='30'?30:null;

function buildChart(rs){

    if(!rs.length||!c||!c.series.length||!c.labels.length){box.innerHTML='<p class="mute" style="padding:30px 0;text-align:center">Belum ada data untuk grafik ini.</p>';return}
    let svg=svgChart(Object.assign({},c,{shape:DF.shape}));
    if(c.colors&&DF.shape==='bar'){let i=0;svg=svg.replace(/<rect x="([\d.]+)" y="([\d.]+)" width="([\d.]+)" height="([\d.]+)" rx="3" fill="[^"]+">/g,(m,a,b2,w,h)=>`<rect x="${a}" y="${b2}" width="${w}" height="${h}" rx="3" fill="${c.colors[i++]||'#2f7fd1'}">`)}
    box.innerHTML=`<p class="ctitle">${esc(c.title)}${DF.subj!=='all'?' · '+SUB[DF.subj].name:''}</p>`+svg};
  drawChart();
  const re=()=>{DF.subj=document.getElementById('fS').value;DF.range=document.getElementById('fR').value;dash(DV)};const bk=document.getElementById('bk');if(bk)bk.onclick=DV.back;
  document.getElementById('fS').onchange=re;document.getElementById('fR').onchange=re;
  document.getElementById('fK').onchange=e=>{DF.kind=e.target.value;if(['mapel','paket','tipe'].includes(DF.kind))DF.shape='bar';document.getElementById('fH').value=DF.shape;drawChart()};
  document.getElementById('fH').onchange=e=>{DF.shape=e.target.value;drawChart()};
  const g2=document.getElementById('goL2');if(g2)g2.onclick=latihan;
  document.getElementById('csv').onclick=()=>{const rows=[['Tanggal','Mapel','Paket','Skor','Benar','Benar sebagian','Jumlah soal','Durasi (detik)']].concat(rs.map(r=>[dfull(r.ts),r.mapel,r.paket,String(r.skor).replace('.',','),r.benar,r.sebagian,r.n,r.durasi]));
    download(new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),'riwayat-latihan-'+DV.user.username+'.csv')};
  document.getElementById('png').onclick=()=>{const s=document.querySelector('#chart svg');if(!s)return;const t=document.querySelector('#chart .ctitle').textContent;
    const xml=new XMLSerializer().serializeToString(s),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1360;c.height=700;const x=c.getContext('2d');
      x.fillStyle=getComputedStyle(document.querySelector('.panel')).backgroundColor||'#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle=inkColor();x.font='600 26px Lexend,sans-serif';x.fillText(t,30,44);x.drawImage(im,0,60,1360,640);
      c.toBlob(b=>download(b,'grafik-kemajuan.png'))};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)};
  scrollTo(0,0);
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ================= REKAP ADMIN ================= */
let ADM=null,AF={kelas:'all',sekolah:'all',subj:'all',range:'all',q:'',sort:'nama',dir:1};
async function admin(force){
  cur=null;homeBtn.hidden=true;setNav('adm');ttl.textContent='Rekap Admin';
  if(!ADM||force){app.innerHTML='<p class="note" style="text-align:center;padding:40px 0">Mengambil data semua siswa…</p>';
    try{const x=await call('adminData',{token:SESS.token});if(!x.ok){app.innerHTML=`<div class="empty"><b>Tidak bisa membuka rekap.</b><p>${esc(x.msg||'Akun ini bukan admin.')}</p></div>`;return}ADM=x}
    catch(e){app.innerHTML='<div class="empty"><b>Tidak bisa terhubung ke server.</b><p>Periksa koneksi lalu coba lagi.</p></div>';return}}
  const users=ADM.users.filter(u=>u.peran!=='admin'),now=Date.now(),lim=AF.range==='7'?7:AF.range==='30'?30:null;
  const uniq=f=>[...new Set(users.map(f).filter(Boolean))].sort();
  const uOk=u=>(AF.kelas==='all'||String(u.kelas)===AF.kelas)&&(AF.sekolah==='all'||u.sekolah===AF.sekolah)&&(!AF.q||(u.nama+' '+u.username).toLowerCase().includes(AF.q.toLowerCase()));
  const US=users.filter(uOk),names=new Set(US.map(u=>u.username));
  const rs=ADM.results.filter(r=>names.has(r.username)&&(AF.subj==='all'||r.subj===AF.subj)&&(!lim||now-r.ts<=lim*864e5));
  const avgOf=a=>a.length?a.reduce((s,r)=>s+r.skor,0)/a.length:null;
  const rows=US.map(u=>{const a=rs.filter(r=>r.username===u.username);return{u,n:a.length,avg:avgOf(a),best:a.length?Math.max(...a.map(r=>r.skor)):null,
    m:Object.fromEntries(Object.keys(SUB).map(k=>[k,avgOf(a.filter(r=>r.subj===k))])),last:a.length?Math.max(...a.map(r=>r.ts)):null,time:a.reduce((s,r)=>s+(r.durasi||0),0)}});
  const key={nama:r=>r.u.nama.toLowerCase(),kelas:r=>String(r.u.kelas),n:r=>r.n,avg:r=>r.avg??-1,best:r=>r.best??-1,mtk:r=>r.m.mtk??-1,bin:r=>r.m.bin??-1,ipas:r=>r.m.ipas??-1,last:r=>r.last||0}[AF.sort];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)*AF.dir});
  const active=rows.filter(r=>r.n).length,avg=avgOf(rs);
  const packStats=[];Object.keys(SUB).forEach(k=>SUB[k].packs.forEach((p,i)=>{const a=rs.filter(r=>r.subj===k&&r.pack===i);if(a.length)packStats.push({k,i,p,n:a.length,u:new Set(a.map(r=>r.username)).size,avg:avgOf(a)})}));
  packStats.sort((a,b)=>a.avg-b.avg);
  const kelasList=uniq(u=>String(u.kelas||''));
  const sel=(id,opts,v)=>`<select id="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
  const th=(k,l)=>`<th data-s="${k}" class="srt">${l}${AF.sort===k?(AF.dir>0?' ▲':' ▼'):''}</th>`;
  const sc=v=>v==null?'<span class="mute">–</span>':`<b style="color:${v>=75?'var(--ok)':v>=50?'inherit':'var(--no)'}">${num(v)}</b>`;
  app.innerHTML=`<div class="dhead"><div><h2>Rekap semua siswa</h2><p class="mute">${users.length} akun siswa terdaftar · data diambil ${dfull(now)}</p></div><div class="fil"><button class="btn sm" id="rf">Muat ulang</button></div></div>
  <div class="fil" style="margin-bottom:14px"><input id="fq" placeholder="Cari nama…" value="${esc(AF.q)}" style="font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:44px">
   ${sel('fk',[['all','Semua kelas'],...kelasList.map(k=>[k,'Kelas '+k])],AF.kelas)}${sel('fs',[['all','Semua sekolah'],...uniq(u=>u.sekolah).map(s=>[s,s])],AF.sekolah)}
   ${sel('fm',[['all','Semua mapel'],...Object.keys(SUB).map(k=>[k,SUB[k].name])],AF.subj)}${sel('fr',[['all','Semua waktu'],['30','30 hari terakhir'],['7','7 hari terakhir']],AF.range)}</div>
  <div class="tiles"><div><small>Siswa (sesuai filter)</small><b>${US.length}</b></div><div><small>Siswa aktif</small><b>${active}</b></div><div><small>Total latihan</small><b>${rs.length}</b></div><div><small>Rata-rata skor</small><b>${avg==null?'–':num(avg)}</b></div></div>
  <section class="panel"><div class="ph"><h3>Rekap per siswa</h3><div class="fil"><button class="btn sm" id="c1">Unduh CSV rekap</button><button class="btn sm" id="c2">Unduh CSV semua hasil</button></div></div>
   <p class="mute" style="margin:0 0 6px;font-size:14px">Klik judul kolom untuk mengurutkan. Klik nama siswa untuk melihat dashboard lengkapnya.</p>
   <div class="tw"><table class="hist adm"><thead><tr>${th('nama','Nama')}${th('kelas','Kelas')}${th('n','Latihan')}${th('avg','Rata-rata')}${th('best','Terbaik')}${Object.keys(SUB).map(k=>th(k,({mtk:'MTK',bin:'B. Indo',ipas:'IPAS'})[k])).join('')}${th('last','Terakhir aktif')}</tr></thead>
   <tbody>${rows.map(r=>`<tr><td><button class="lnk" data-u="${esc(r.u.username)}">${esc(r.u.nama)}</button><br><small class="mute">@${esc(r.u.username)}${r.u.sekolah?' · '+esc(r.u.sekolah):''}</small></td><td>${esc(r.u.kelas||'–')}</td><td>${r.n}</td><td>${sc(r.avg)}</td><td>${sc(r.best)}</td>${Object.keys(SUB).map(k=>`<td>${sc(r.m[k])}</td>`).join('')}<td>${r.last?dfull(r.last):'<span class="mute">belum pernah</span>'}</td></tr>`).join('')||'<tr><td colspan="9" class="mute">Tidak ada siswa pada filter ini.</td></tr>'}</tbody></table></div></section>
  <section class="panel"><div class="ph"><h3>Grafik rekap</h3><div class="fil">${sel('gk',[['kelas','Rata-rata skor per kelas'],['mapel','Rata-rata skor per mapel'],['paket','Rata-rata skor per paket'],['aktif','Jumlah latihan per minggu']],AF.g||'mapel')}</div></div><div id="achart"></div></section>
  <section class="panel"><div class="ph"><h3>Paket yang paling sulit</h3></div><div class="tw"><table class="hist"><thead><tr><th>Mapel</th><th>Paket</th><th>Dikerjakan</th><th>Siswa</th><th>Rata-rata</th></tr></thead><tbody>${packStats.slice(0,12).map(p=>`<tr><td><span class="dotc" style="background:${COL[p.k]}"></span>${SUB[p.k].name}</td><td>${esc(p.p.n+' – '+p.p.d)}</td><td>${p.n}×</td><td>${p.u}</td><td>${sc(p.avg)}</td></tr>`).join('')||'<tr><td colspan="5" class="mute">Belum ada data.</td></tr>'}</tbody></table></div></section>`;
  const drawA=()=>{const g=AF.g||'mapel',box=document.getElementById('achart');let c;
    if(g==='kelas'){const ks=[...new Set(US.map(u=>String(u.kelas||'–')))].sort();const v=ks.map(k=>avgOf(rs.filter(r=>String((ADM.users.find(u=>u.username===r.username)||{}).kelas||'–')===k)));c={labels:ks.map(k=>'Kelas '+k),series:[{name:'Rata-rata',color:'#2f7fd1',values:v}],shape:'bar',max:100}}
    else if(g==='mapel'){const ks=Object.keys(SUB);c={labels:ks.map(k=>SUB[k].name),series:[{name:'Rata-rata',color:'#2f7fd1',values:ks.map(k=>avgOf(rs.filter(r=>r.subj===k)))}],shape:'bar',max:100,colors:ks.map(k=>COL[k])}}
    else if(g==='paket'){const ps=packStats.slice().sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:a.i-b.i);c={labels:ps.map(p=>({mtk:'MTK',bin:'BIN',ipas:'IPAS'})[p.k]+' '+(p.i+1)),series:[{name:'Rata-rata',color:'#2f7fd1',values:ps.map(p=>p.avg)}],shape:'bar',max:100,colors:ps.map(p=>COL[p.k])}}
    else{const wk=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};const ws=[...new Set(rs.map(r=>wk(r.ts)))].sort((a,b)=>a-b);
      c={labels:ws.map(w=>'Mg '+dstr(w)),series:Object.keys(SUB).map(k=>({name:SUB[k].name,color:COL[k],values:ws.map(w=>rs.filter(r=>r.subj===k&&wk(r.ts)===w).length)})),shape:'bar'}}
    if(!rs.length||!c.labels.length){box.innerHTML='<p class="mute" style="padding:30px 0;text-align:center">Belum ada data.</p>';return}
    let svg=svgChart(c);if(c.colors){let i=0;svg=svg.replace(/(<rect x="[\d.]+" y="[\d.]+" width="[\d.]+" height="[\d.]+" rx="3" fill=")[^"]+"/g,(m,p)=>p+(c.colors[i++]||'#2f7fd1')+'"')}box.innerHTML=svg};
  drawA();
  const set=(k,v)=>{AF[k]=v;admin()};
  document.getElementById('fk').onchange=e=>set('kelas',e.target.value);document.getElementById('fs').onchange=e=>set('sekolah',e.target.value);
  document.getElementById('fm').onchange=e=>set('subj',e.target.value);document.getElementById('fr').onchange=e=>set('range',e.target.value);
  const fq=document.getElementById('fq');fq.onchange=e=>set('q',e.target.value.trim());fq.onkeydown=e=>{if(e.key==='Enter')set('q',fq.value.trim())};
  document.getElementById('gk').onchange=e=>{AF.g=e.target.value;drawA()};
  document.getElementById('rf').onclick=()=>admin(true);
  app.querySelectorAll('[data-s]').forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(AF.sort===k)AF.dir*=-1;else{AF.sort=k;AF.dir=k==='nama'||k==='kelas'?1:-1}admin()});
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=ADM.users.find(x=>x.username===b.dataset.u);DF.subj='all';DF.range='all';
    dash({user:u,res:ADM.results.filter(r=>r.username===u.username).sort((a,b)=>a.ts-b.ts),back:()=>admin()})});
  const csv=(rows,name)=>download(new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),name);
  const n1=v=>v==null?'':String(Math.round(v*10)/10).replace('.',',');
  document.getElementById('c1').onclick=()=>csv([['Nama','Username','Kelas','Sekolah','Jumlah latihan','Rata-rata','Terbaik',...Object.keys(SUB).map(k=>'Rata-rata '+SUB[k].name),'Terakhir aktif','Total waktu (menit)']].concat(rows.map(r=>[r.u.nama,r.u.username,r.u.kelas,r.u.sekolah,r.n,n1(r.avg),n1(r.best),...Object.keys(SUB).map(k=>n1(r.m[k])),r.last?dfull(r.last):'',Math.round(r.time/60)])),'rekap-siswa.csv');
  document.getElementById('c2').onclick=()=>csv([['Tanggal','Nama','Username','Kelas','Sekolah','Mapel','Paket','Skor','Benar','Jumlah soal','Durasi (detik)']].concat(rs.map(r=>{const u=ADM.users.find(x=>x.username===r.username)||{};return[dfull(r.ts),u.nama,r.username,u.kelas,u.sekolah,r.mapel,r.paket,n1(r.skor),r.benar,r.n,r.durasi]})),'semua-hasil-latihan.csv');
  scrollTo(0,0);
}

homeBtn.onclick=()=>guard(()=>homeBtn.textContent.includes('paket')?packs(cur):latihan());
nav.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>guard(()=>({home,lat:latihan,dash:()=>dash(),adm:()=>admin()})[b.dataset.v]()));
document.getElementById('out').onclick=()=>guard(async()=>{try{await call('logout',{token:SESS.token})}catch(e){}LS.del('tka-sess');SESS=null;RES=[];authScreen('in')});
boot();
}

</script>
